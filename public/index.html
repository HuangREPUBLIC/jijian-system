<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>计件跟踪</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6A3FC1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- iOS 添加到主屏后全屏运行 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="计件">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"><div class="login-page"><div class="login-inner"><div class="login-brand">
    <div class="login-logo">
      <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="boot-lg-bg" x1="60" y1="30" x2="440" y2="490" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8E63E6"/><stop offset=".55" stop-color="#6A3FC1"/><stop offset="1" stop-color="#422384"/>
          </linearGradient>
          <linearGradient id="boot-lg-gloss" x1="90" y1="60" x2="300" y2="300" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#boot-lg-bg)"/>
        <path d="M116 0h280a116 116 0 0 1 116 116v70C420 96 300 40 176 40 152 40 128 42 106 46A116 116 0 0 1 116 0Z" fill="url(#boot-lg-gloss)"/>
        <path d="M174 92H338A24 24 0 0 1 362 116V282H150V116A24 24 0 0 1 174 92Z" fill="#FFFFFF"/>
        <rect x="202" y="133" width="108" height="108" rx="16" stroke="#6A3FC1" stroke-width="22"/>
        <rect x="237" y="168" width="38" height="38" rx="6" fill="#6A3FC1"/>
        <path d="M150 316H362V396A24 24 0 0 1 338 420H174A24 24 0 0 1 150 396Z" fill="#FFFFFF" transform="rotate(9 256 368)"/>
      </svg>
    </div>
    <p class="login-company">惠锦制衣有限公司</p>
    <h1 class="login-title">计件跟踪</h1>
  </div></div></div></div>
  <!-- 打印专用容器：屏幕上恒隐藏，@media print 时只显示它。
       不用 window.open 打开服务端直出的打印页——本系统鉴权走 Authorization: Bearer
       （token 存在 localStorage），新窗口带不上这个头，直出页面必然 401。 -->
  <div id="print-root" aria-hidden="true"></div>
  <div class="msg" id="msg" role="status"></div>
  <div class="mask" id="mask"></div>
  <script>
    // 锁定屏幕：禁止手机上双指/双击缩放整个页面
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
  </script>
  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
